<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualisasi Verifikasi Graph Coloring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .node {
            transition: all 0.5s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .edge {
            transition: stroke 0.3s ease, stroke-width 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4">

    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row">
        
        <!-- Left Panel: Graph Canvas -->
        <div class="w-full md:w-3/5 bg-slate-50 p-6 relative flex flex-col items-center border-b md:border-b-0 md:border-r border-slate-200">
            <h2 class="text-xl font-bold text-slate-800 mb-2">Graf Jadwal Mahasiswa</h2>
            <p class="text-sm text-slate-500 mb-6 text-center">Garis menandakan bentrok jadwal. Tidak boleh ada simpul terhubung dengan warna sama.</p>
            
            <!-- Graph Area -->
            <div id="graph-container" class="relative w-[300px] h-[300px] mx-auto">
                <!-- Canvas for edges -->
                <canvas id="edges-canvas" width="300" height="300" class="absolute top-0 left-0 z-0"></canvas>
                <!-- Nodes will be injected here via JS -->
                <div id="nodes-container" class="absolute top-0 left-0 w-full h-full z-10"></div>
            </div>

            <!-- Legend -->
            <div class="mt-8 flex gap-4 text-xs font-semibold text-slate-600">
                <div class="flex items-center gap-1"><div class="w-3 h-3 rounded-full bg-red-400"></div> Kel 1</div>
                <div class="flex items-center gap-1"><div class="w-3 h-3 rounded-full bg-blue-400"></div> Kel 2</div>
                <div class="flex items-center gap-1"><div class="w-3 h-3 rounded-full bg-green-400"></div> Kel 3</div>
            </div>
        </div>

        <!-- Right Panel: Controls & Logs -->
        <div class="w-full md:w-2/5 p-6 flex flex-col">
            <h2 class="text-xl font-bold text-slate-800 mb-4">Tahap Verifikasi NP</h2>
            
            <div class="flex-grow flex flex-col mb-4">
                <div class="bg-slate-900 text-green-400 font-mono text-sm p-4 rounded-lg flex-grow overflow-y-auto max-h-[300px]" id="log-panel">
                    > Sistem diinisialisasi...<br>
                    > Menunggu perintah mulai.
                </div>
            </div>

            <div class="flex flex-col gap-3 mt-auto">
                <div class="text-sm font-medium text-slate-700">Status: <span id="status-text" class="text-blue-600 font-bold">Belum Dimulai</span></div>
                
                <button id="next-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 shadow-md flex justify-center items-center gap-2">
                    Lanjut ke Tahap Berikutnya 
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 1.414L10.586 9H7a1 1 0 100 2h3.586l-1.293 1.293a1 1 0 101.414 1.414l3-3a1 1 0 000-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
                <button id="reset-btn" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2 px-4 rounded-xl transition duration-200">
                    Ulangi Simulasi
                </button>
            </div>
        </div>
    </div>

    <script>
        // Graph Data
        const nodes = [
            { id: 0, name: 'Kaindra', x: 150, y: 30, color: null, targetColor: '#f87171' }, // Red
            { id: 1, name: 'Bia', x: 270, y: 110, color: null, targetColor: '#60a5fa' },     // Blue
            { id: 2, name: 'Ardo', x: 220, y: 250, color: null, targetColor: '#f87171' },    // Red
            { id: 3, name: 'Caca', x: 80, y: 250, color: null, targetColor: '#60a5fa' },     // Blue
            { id: 4, name: 'Denis', x: 30, y: 110, color: null, targetColor: '#4ade80' }     // Green
        ];

        // Edges (Conflicts)
        const edges = [
            { source: 0, target: 1 }, // Kaindra - Bia
            { source: 1, target: 2 }, // Bia - Ardo
            { source: 2, target: 3 }, // Ardo - Caca
            { source: 3, target: 0 }, // Caca - Kaindra
            { source: 1, target: 4 }  // Bia - Denis
        ];

        // System State
        let currentStep = 0;
        let verifyingEdgeIndex = 0;
        
        // DOM Elements
        const canvas = document.getElementById('edges-canvas');
        const ctx = canvas.getContext('2d');
        const nodesContainer = document.getElementById('nodes-container');
        const logPanel = document.getElementById('log-panel');
        const nextBtn = document.getElementById('next-btn');
        const resetBtn = document.getElementById('reset-btn');
        const statusText = document.getElementById('status-text');

        function log(message, type = 'info') {
            const colors = { info: 'text-green-400', warning: 'text-yellow-400', error: 'text-red-400', success: 'text-blue-400' };
            const time = new Date().toLocaleTimeString('id-ID', { hour12: false });
            logPanel.innerHTML += `<div class="${colors[type]}">[${time}] ${message}</div>`;
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function drawEdges(highlightIndex = -1, isValid = null) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            edges.forEach((edge, index) => {
                const n1 = nodes[edge.source];
                const n2 = nodes[edge.target];
                
                ctx.beginPath();
                ctx.moveTo(n1.x, n1.y);
                ctx.lineTo(n2.x, n2.y);
                
                if (index === highlightIndex) {
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = isValid === true ? '#22c55e' : (isValid === false ? '#ef4444' : '#eab308'); // Green, Red, Yellow
                    ctx.setLineDash([5, 5]);
                } else {
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#cbd5e1';
                    ctx.setLineDash([]);
                }
                
                ctx.stroke();
            });
        }

        function renderNodes() {
            nodesContainer.innerHTML = '';
            nodes.forEach(node => {
                const el = document.createElement('div');
                el.className = 'node absolute rounded-full flex items-center justify-center text-xs font-bold border-2 border-slate-700 transform -translate-x-1/2 -translate-y-1/2';
                el.style.width = '50px';
                el.style.height = '50px';
                el.style.left = `${node.x}px`;
                el.style.top = `${node.y}px`;
                el.style.backgroundColor = node.color || 'white';
                el.style.color = node.color ? 'white' : '#334155';
                el.innerText = node.name;
                nodesContainer.appendChild(el);
            });
        }

        function nextAction() {
            if (currentStep === 0) {
                // Step 0 -> 1: Provide Candidate Solution
                nodes.forEach(n => n.color = n.targetColor);
                renderNodes();
                log("Tahap 1: Kandidat solusi diterima (Pemberian warna).", "info");
                log("Waktu eksekusi: O(V).", "info");
                statusText.innerText = "Verifikasi Dimulai";
                currentStep++;
            } 
            else if (currentStep === 1) {
                // Start verifying edges
                if (verifyingEdgeIndex < edges.length) {
                    const edge = edges[verifyingEdgeIndex];
                    const n1 = nodes[edge.source];
                    const n2 = nodes[edge.target];
                    
                    log(`Mengecek Sisi ${verifyingEdgeIndex+1}: ${n1.name} & ${n2.name}...`, "warning");
                    drawEdges(verifyingEdgeIndex, null); // Highlight yellow
                    
                    // Simulate a small delay for verification result
                    nextBtn.disabled = true;
                    setTimeout(() => {
                        const valid = n1.color !== n2.color;
                        drawEdges(verifyingEdgeIndex, valid);
                        
                        if (valid) {
                            log(`  -> Valid! Warna berbeda.`, "success");
                            verifyingEdgeIndex++;
                        } else {
                            log(`  -> INVALID! Bentrok warna. Solusi ditolak.`, "error");
                            statusText.innerText = "Solusi Tidak Valid";
                            statusText.className = "text-red-600 font-bold";
                            currentStep = 99; // Error state
                        }
                        nextBtn.disabled = false;
                    }, 800);
                } else {
                    // Verification Complete
                    drawEdges(); // clear highlights
                    log("Semua sisi (E) berhasil diverifikasi!", "success");
                    log("Kesimpulan: SOLUSI VALID (Diterima).", "success");
                    log("Kompleksitas Verifikasi: O(|E|).", "info");
                    statusText.innerText = "Verifikasi Selesai & Valid";
                    statusText.className = "text-green-600 font-bold";
                    nextBtn.disabled = true;
                    nextBtn.classList.add("opacity-50", "cursor-not-allowed");
                }
            }
        }

        function resetSimulation() {
            currentStep = 0;
            verifyingEdgeIndex = 0;
            nodes.forEach(n => n.color = null);
            logPanel.innerHTML = '> Sistem di-reset...<br>> Menunggu perintah mulai.';
            statusText.innerText = "Belum Dimulai";
            statusText.className = "text-blue-600 font-bold";
            nextBtn.disabled = false;
            nextBtn.classList.remove("opacity-50", "cursor-not-allowed");
            drawEdges();
            renderNodes();
        }

        nextBtn.addEventListener('click', nextAction);
        resetBtn.addEventListener('click', resetSimulation);

        // Initial Render
        drawEdges();
        renderNodes();
    </script>
</body>
</html>
